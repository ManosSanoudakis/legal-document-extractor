server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        client_max_body_size 25m;   # backend enforces the real 20 MB limit
        proxy_read_timeout 300s;    # evaluation runs two models back to back
    }

    location / {
        try_files $uri /index.html;
    }
}
