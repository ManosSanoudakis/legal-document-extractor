services:
  api:
    build: .
    environment:
      # Optional comma-separated model list; empty uses the defaults in extractor.py
      - GEMINI_MODELS=${GEMINI_MODELS:-}
      # History (extracted results, never PDFs) lives in the volume below
      - DATA_DIR=/data
      # Optional: delete history entries older than this many days
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-}
    volumes:
      - history:/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  history:
