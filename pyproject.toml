[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI dependency defaults (File(), Form()) are idiomatic
    "UP038",  # isinstance(x, (A, B)) is clearer and faster than A | B
]

[tool.pytest.ini_options]
testpaths = ["tests"]
